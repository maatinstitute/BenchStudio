[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchstudio"
version = "0.1.0rc2"
description = "Research-use experimental evaluation infrastructure for AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Research-Use-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Alba Maria Tellez Fernandez" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/amtellezfernandez/BenchStudio"
Documentation = "https://github.com/amtellezfernandez/BenchStudio/blob/main/docs/research-preview.md"
Issues = "https://github.com/amtellezfernandez/BenchStudio/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "numpy>=1.24", "cryptography>=41"]
yaml = ["PyYAML>=6.0"]
mujoco = ["mujoco>=3.0"]
gymnasium = ["gymnasium>=0.29"]
genesis = ["genesis-world>=1.4,<2"]
signing = ["cryptography>=41"]

[project.scripts]
benchstudio = "benchstudio.commands:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchstudio"
version = "0.1.0"
description = "Reproducible evaluation and evidence tools for embodied AI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
authors = [{ name = "Alba Maria Tellez Fernandez" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Robotics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/amtellezfernandez/BenchStudio"
Documentation = "https://github.com/amtellezfernandez/BenchStudio/tree/main/docs"
Repository = "https://github.com/amtellezfernandez/BenchStudio"
Issues = "https://github.com/amtellezfernandez/BenchStudio/issues"

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "numpy>=1.24", "cryptography>=41"]
yaml = ["PyYAML>=6.0"]
mujoco = ["mujoco>=3.0"]
gymnasium = ["gymnasium>=0.29"]
genesis = ["genesis-world>=1.4,<2"]
signing = ["cryptography>=41"]

[project.scripts]
benchstudio-run = "benchstudio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

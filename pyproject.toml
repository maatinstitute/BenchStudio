[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchstudio"
version = "0.1.0"
description = "Evidence-aware evaluation infrastructure for embodied AI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Alba Maria Tellez Fernandez" }]
dependencies = []

[project.urls]
Repository = "https://github.com/maatinstitute/BenchStudio"
Documentation = "https://github.com/maatinstitute/BenchStudio/tree/main/docs"
Issues = "https://github.com/maatinstitute/BenchStudio/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "numpy>=1.24", "cryptography>=41", "Pillow>=10"]
yaml = ["PyYAML>=6.0"]
mujoco = ["mujoco>=3.0"]
gymnasium = ["gymnasium>=0.29"]
genesis = ["genesis-world>=1.4,<2"]
signing = ["cryptography>=41"]

[project.scripts]
benchstudio-run = "benchstudio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Begin with correctness findings. Formatting and import-order rules can be
# enabled incrementally without mixing a repository-wide rewrite into this gate.
select = ["F"]

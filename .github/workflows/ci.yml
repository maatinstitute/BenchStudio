name: BenchStudio CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python -m pytest -q tests/test_ci_smoke.py
      - run: uv run --locked python -m compileall -q src tests examples/external_runtime

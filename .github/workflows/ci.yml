name: BenchStudio CI

permissions: {}

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python -m pytest -q tests/test_ci_smoke.py
      - run: uv run --locked python -m compileall -q src tests examples/external_runtime

  portable-core:
    name: Portable core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check --output-format=github .
      - run: >-
          uv run --locked python -m pytest -q
          tests/test_authoring.py
          tests/test_campaigns.py
          tests/test_core_import_without_numpy.py

  authoring-types:
    name: Type-check authoring API
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked mypy

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv build
      - run: uv venv --python 3.10 "${RUNNER_TEMP}/benchstudio-wheel"
      - run: >-
          uv pip install
          --python "${RUNNER_TEMP}/benchstudio-wheel/bin/python"
          dist/*.whl
      - run: >-
          "${RUNNER_TEMP}/benchstudio-wheel/bin/python"
          scripts/smoke_installed_package.py
      - run: "${RUNNER_TEMP}/benchstudio-wheel/bin/benchstudio-run --help"

  workflow-security:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uvx zizmor==1.32.0 --persona=pedantic .

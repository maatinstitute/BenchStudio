name: BenchStudio CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m pytest -q tests/test_ci_smoke.py
      - run: python -m compileall -q src tests examples/external_runtime

      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build --sdist --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/benchstudio-wheel-env
          /tmp/benchstudio-wheel-env/bin/python -m pip install --no-deps dist/*.whl
          /tmp/benchstudio-wheel-env/bin/python -m benchstudio.cli --help
          /tmp/benchstudio-wheel-env/bin/benchstudio-run --help

      - name: Install source distribution in a clean environment
        run: |
          python -m venv /tmp/benchstudio-sdist-env
          /tmp/benchstudio-sdist-env/bin/python -m pip install --no-deps dist/*.tar.gz
          /tmp/benchstudio-sdist-env/bin/python -m benchstudio.cli --help
          /tmp/benchstudio-sdist-env/bin/benchstudio-run --help
